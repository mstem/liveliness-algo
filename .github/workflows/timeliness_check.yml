name: Timeliness Check

on:
  schedule:
    - cron: '0 9 * * *'  # every day at 09:00 UTC
  workflow_dispatch:         # also allows manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: timeliness-check
  cancel-in-progress: false  # wait for current run to finish, don't overlap

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8       # kill if a run stalls (shouldn't exceed ~5 min for 10 projects)

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run timeliness check
        env:
          AIRTABLE_PAT:    ${{ secrets.AIRTABLE_PAT }}
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}  # built-in ephemeral token; read-only per permissions block
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python timeliness_check.py
